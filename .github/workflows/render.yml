name: Render Pool
on:
  repository_dispatch:
    types: [render_pool]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      CLOUDINARY_CLOUD_NAME: dnzxeped5
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.0-flash
      RAPIDAPI_YT_KEY: ${{ secrets.RAPIDAPI_YT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Write test decision.json
        run: |
          cat > decision.json << 'EOF'
          {
            "target_posts": 1,
            "candidates": [
              {
                "rank": 1,
                "video_id": "tmdb_test001",
                "video_url": "https://youtu.be/Mzw2ttJD2qQ?si=-wGPimGmMM7Y2BNC",
                "description": "Test Trailer",
                "niche": "movietrailer",
                "overview": "A test run to confirm the RapidAPI download path works end to end."
              }
            ]
          }
          EOF
      - run: python render.py
