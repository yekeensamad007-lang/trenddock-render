name: Render Pool
on:
  repository_dispatch:
    types: [render_pool]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      CLOUDINARY_CLOUD_NAME: dnzxeped5
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.0-flash
      RAPIDAPI_YT_KEY: ${{ secrets.RAPIDAPI_YT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Save incoming payload
        run: echo '${{ toJSON(github.event.client_payload) }}' > decision.json
      - name: Write YouTube cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES_B64 }}" | base64 -d > youtube_cookies.txt
      - name: Test download with player_client fix
        run: |
          yt-dlp \
            -f "bestvideo+bestaudio/best[ext=mp4]/best" \
            --merge-output-format mp4 \
            --cookies youtube_cookies.txt \
            --extractor-args "youtube:player_client=android,web" \
            -o "test_download.mp4" \
            "https://youtu.be/0LR2U78MW8A?si=P0UTKBm202FRFb_K"
          echo "--- File check ---"
          ls -la test_download.mp4
          ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 test_download.mp4 && echo "HAS AUDIO" || echo "NO AUDIO DETECTED"
      - run: python render.py
